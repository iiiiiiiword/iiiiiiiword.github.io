<section class="site-stats" aria-label="Website statistics" data-site-stats>
  <button class="site-stats__like" type="button" data-like-button aria-pressed="false">
    <i class="fas fa-heart" aria-hidden="true"></i>
    <span data-like-label>Like</span>
    <strong data-like-count aria-live="polite">--</strong>
  </button>
  <div class="site-stats__views" title="Total visits">
    <i class="fas fa-eye" aria-hidden="true"></i>
    <span>Views</span>
    <strong data-view-count aria-live="polite">--</strong>
  </div>
  <p class="site-stats__status" data-stats-status aria-live="polite"></p>
</section>
